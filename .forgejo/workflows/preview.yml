name: Publish Svelte + Vite preview

on:
  push:
    branches: [codex/vite-nanostores]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: holy-songs-svelte-vite-preview
  cancel-in-progress: true

env:
  IMAGE_NAME: git.bcgen.ie/samuel/holy-songs

jobs:
  publish:
    runs-on: docker
    container:
      image: node:24-bookworm

    steps:
      - uses: actions/checkout@v4

      - name: Validate
        run: |
          set -eu
          npm ci
          npm run typecheck
          npm test

      - name: Build and publish preview image
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -q ca-certificates docker.io
          printf '%s' "$REGISTRY_TOKEN" |
            docker login git.bcgen.ie --username "$REGISTRY_USERNAME" --password-stdin
          image_tag="$IMAGE_NAME:$GITHUB_SHA-preview"
          docker build \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --build-arg "IMAGE_REF=$image_tag" \
            --tag "$image_tag" \
            --tag "$IMAGE_NAME:react-free-preview" \
            .
          docker push "$image_tag"
          docker push "$IMAGE_NAME:react-free-preview"
